// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        // Aliyun mirrors keep builds working where dl.google.com is slow or blocked.
        maven { url 'https://maven.aliyun.com/repository/google'; allowInsecureProtocol = false }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        // Aliyun mirrors keep builds working where dl.google.com is slow or blocked.
        maven { url 'https://maven.aliyun.com/repository/google'; allowInsecureProtocol = false }
        maven { url 'https://maven.aliyun.com/repository/public' }
        google()
        mavenCentral()
    }
}

// Keep plugin modules (e.g. :capacitor-android) on the same Build Tools as the
// app; the SDK bundled with a given machine may not include AGP's default.
subprojects {
    plugins.withId('com.android.library') {
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
    plugins.withId('com.android.application') {
        android.buildToolsVersion = rootProject.ext.buildToolsVersion
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
