name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      # Set this to an existing tag to re-attach packages without moving the tag.
      tag:
        description: 标签（留空则按本次 push 的标签发布）
        required: false
        type: string
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: ${{matrix.name}}
    runs-on: ${{matrix.os}}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
            args: --win nsis portable --x64
          - name: Windows arm64
            os: windows-latest
            args: --win nsis portable --arm64
          - name: macOS x64
            os: macos-latest
            args: --mac dmg zip --x64
          - name: macOS arm64
            os: macos-latest
            args: --mac dmg zip --arm64
          - name: macOS universal
            os: macos-latest
            args: --mac dmg zip --universal
          - name: Linux x64
            os: ubuntu-latest
            args: --linux AppImage deb rpm tar.gz --x64
          - name: Linux arm64
            os: ubuntu-24.04-arm
            args: --linux AppImage deb rpm tar.gz --arm64
    env:
      ELECTRON_CACHE: ${{github.workspace}}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{github.workspace}}/.cache/electron-builder
      USE_HARD_LINKS: 'true'
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Pillow for icon generation
        run: python -m pip install --disable-pip-version-check Pillow

      - name: Cache Electron toolsets
        uses: actions/cache@v6
        with:
          path: ${{github.workspace}}/.cache
          key: ${{runner.os}}-${{runner.arch}}-electron-${{hashFiles('package-lock.json', 'electron-builder.yml')}}
          restore-keys: |
            ${{runner.os}}-${{runner.arch}}-electron-

      - name: Install Linux packaging tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y rpm libopenjp2-tools

      - name: Install dependencies
        run: npm ci

      - name: Download Electron runtime
        run: node node_modules/electron/install.js

      - name: Build web bundle and desktop icons
        run: npm run desktop:prepare

      - name: Package desktop app
        shell: bash
        env:
          # Without a Developer ID certificate, arm64/universal macOS builds must
          # still be ad-hoc signed or macOS refuses to launch them. The hook in
          # scripts/after-sign.cjs skips itself when a real identity is present.
          STAY_TUNED_ADHOC_SIGN: '1'
          # Configure these repository secrets to enable real signing/notarization.
          CSC_LINK: ${{secrets.MAC_CSC_LINK}}
          CSC_KEY_PASSWORD: ${{secrets.MAC_CSC_KEY_PASSWORD}}
          APPLE_API_KEY: ${{secrets.APPLE_API_KEY}}
          APPLE_API_KEY_ID: ${{secrets.APPLE_API_KEY_ID}}
          APPLE_API_ISSUER: ${{secrets.APPLE_API_ISSUER}}
          APPLE_TEAM_ID: ${{secrets.APPLE_TEAM_ID}}
          WIN_CSC_LINK: ${{secrets.WIN_CSC_LINK}}
          WIN_CSC_KEY_PASSWORD: ${{secrets.WIN_CSC_KEY_PASSWORD}}
        run: npx electron-builder ${{matrix.args}} --publish never

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v7
        with:
          name: desktop-${{matrix.os}}-${{strategy.job-index}}
          path: |
            desktop-dist/**/*.exe
            desktop-dist/**/*.dmg
            desktop-dist/**/*.zip
            desktop-dist/**/*.AppImage
            desktop-dist/**/*.deb
            desktop-dist/**/*.rpm
            desktop-dist/**/*.tar.gz
            desktop-dist/**/*.blockmap
            desktop-dist/latest*.yml
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v') || inputs.tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download desktop artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          path: desktop-dist
          merge-multiple: true

      # `gh release upload` only touches the files it is given, so it cannot
      # rewrite another workflow's asset metadata. The Android and HarmonyOS
      # workflows publish to the same release at the same time, and a
      # release-wide sync here used to fail with "Not Found" mid-upload.
      - name: Attach desktop packages to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No checkout in this job, so tell gh which repository to talk to.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || \
            gh release create "$RELEASE_TAG" --title "留频 $RELEASE_TAG" --generate-notes
          # Only the packaged artifacts sit at the top level; the *-unpacked
          # directories hold the same files under duplicate names (two
          # elevate.exe copies broke the previous upload with a 422).
          mapfile -d '' assets < <(find desktop-dist -maxdepth 1 -type f \
            \( -name '*.exe' -o -name '*.dmg' -o -name '*.zip' -o -name '*.AppImage' \
               -o -name '*.deb' -o -name '*.rpm' -o -name '*.tar.gz' -o -name '*.blockmap' \
               -o -name 'latest*.yml' \) -print0)
          printf 'uploading %s files to %s\n' "${#assets[@]}" "$RELEASE_TAG"
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
